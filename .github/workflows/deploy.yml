# Deploy this storefront to Cloudflare Workers (Actions tab → Deploy → Run workflow).
# Repo secret: CLOUDFLARE_API_TOKEN. The engine must list this storefront in its STORE_CORS.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      commerce_url:
        description: "The engine's URL (baked into the build)"
        required: true
        default: https://next-commerce-engine.okuruchristian.workers.dev
      config:
        description: "Wrangler config"
        required: true
        default: wrangler.jsonc

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIG: ${{ inputs.config }}
      NEXT_PUBLIC_COMMERCE_URL: ${{ inputs.commerce_url }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        run: |
          [[ "$CONFIG" =~ ^wrangler(\.[a-z0-9-]+)?\.jsonc$ && -f "$CONFIG" ]] || { echo "::error::Unknown config: $CONFIG"; exit 1; }
          [[ "$NEXT_PUBLIC_COMMERCE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || { echo "::error::commerce_url must be https://host"; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx opennextjs-cloudflare build
      - name: Deploy
        run: npx opennextjs-cloudflare deploy -c "$CONFIG"
